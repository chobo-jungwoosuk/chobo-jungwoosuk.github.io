<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="한국폴리텍대학 창원캠퍼스 산업설비자동화과 MSDS 자료실">
  <title>산업설비자동화과 MSDS 자료실</title>
  <style>
    :root {
      --navy: #123d6a;
      --blue: #1f5f99;
      --light: #f4f7fa;
      --line: #d8e1ea;
      --text: #1d2935;
      --muted: #5e6b78;
      --white: #ffffff;
      --focus: #ffbf47;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      color: var(--text);
      background: var(--light);
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: var(--white);
      padding: 42px 20px 36px;
      text-align: center;
    }
    header p {
      margin: 0 0 8px;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      opacity: 0.95;
    }
    header h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.3rem);
      letter-spacing: -0.04em;
    }
    main {
      width: min(1080px, calc(100% - 32px));
      margin: -18px auto 48px;
    }
    .search-panel {
      background: var(--white);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(20, 48, 77, 0.12);
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }
    input[type="search"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
    }
    input[type="search"]:focus {
      outline: 3px solid var(--focus);
      border-color: var(--navy);
    }
    .notice {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .room {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(20, 48, 77, 0.06);
    }
    .room h2 {
      margin: 0;
      padding: 17px 20px;
      background: #eaf1f7;
      color: var(--navy);
      font-size: 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    .documents {
      list-style: none;
      margin: 0;
      padding: 8px 18px 16px;
    }
    .documents li {
      border-bottom: 1px solid #edf1f4;
    }
    .documents li:last-child { border-bottom: 0; }
    .documents a {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 4px;
      color: #124f85;
      text-decoration: none;
      font-weight: 600;
    }
    .documents a:hover { text-decoration: underline; }
    .documents a:focus {
      outline: 3px solid var(--focus);
      border-radius: 4px;
    }
    .tag {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
    }
    .empty {
      padding: 18px 4px 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .no-results {
      display: none;
      margin-top: 20px;
      padding: 24px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    footer {
      text-align: center;
      color: var(--muted);
      padding: 18px;
      font-size: 0.85rem;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      header { padding-top: 34px; }
      main { width: min(100% - 20px, 1080px); }
    }
  </style>
</head>
<body>
  <header>
    <p>한국폴리텍대학 창원캠퍼스 산업설비자동화과</p>
    <h1>MSDS 자료실</h1>
  </header>

  <main>
    <section class="search-panel" aria-labelledby="search-title">
      <label id="search-title" for="search">물질명·제품명 검색</label>
      <input id="search" type="search" placeholder="예: 산소, 아세틸렌, 절삭유" autocomplete="off">
      <p class="notice">자료를 선택하면 해당 물질안전보건자료(PDF)가 새 창에서 열립니다.</p>
    </section>

    <section class="grid" id="roomGrid" aria-label="실습실별 MSDS 목록"></section>
    <div class="no-results" id="noResults">검색 결과가 없습니다.</div>
  </main>

  <footer>
    자료의 최신 개정일과 제조사 정보를 확인하여 관리하십시오.
  </footer>

  <script>
    /*
      PDF 추가 방법
      1. 아래 경로에 PDF를 업로드합니다.
         예: pdf/가스용접실/산소.pdf
      2. documents 배열에 한 줄을 추가합니다.
         { room: "가스용접실", title: "산소", file: "pdf/가스용접실/산소.pdf", updated: "2026-08" }
    */
    const rooms = [
      "용접실",
      "가스용접실",
      "배관실습실",
      "X-선실",
      "자동화실습실",
      "기타"
    ];

    const documents = [
      // 아래는 입력 예시입니다. 실제 PDF를 올린 뒤 앞의 //를 지우세요.
      // { room: "가스용접실", title: "산소", file: "pdf/가스용접실/산소.pdf", updated: "2026-08" },
      // { room: "가스용접실", title: "아세틸렌", file: "pdf/가스용접실/아세틸렌.pdf", updated: "2026-08" },
      // { room: "용접실", title: "FCAW 와이어", file: "pdf/용접실/FCAW-와이어.pdf", updated: "2026-08" }
    ];

    const roomGrid = document.getElementById("roomGrid");
    const searchInput = document.getElementById("search");
    const noResults = document.getElementById("noResults");

    function safeText(value) {
      return String(value ?? "");
    }

    function render(query = "") {
      const keyword = query.trim().toLocaleLowerCase("ko-KR");
      roomGrid.innerHTML = "";
      let visibleCount = 0;

      rooms.forEach((room) => {
        const matched = documents
          .filter((doc) => doc.room === room)
          .filter((doc) =>
            !keyword ||
            `${doc.room} ${doc.title}`.toLocaleLowerCase("ko-KR").includes(keyword)
          )
          .sort((a, b) => a.title.localeCompare(b.title, "ko"));

        if (keyword && matched.length === 0) return;

        visibleCount += matched.length || (!keyword ? 1 : 0);

        const article = document.createElement("article");
        article.className = "room";

        const heading = document.createElement("h2");
        heading.textContent = room;
        article.appendChild(heading);

        const list = document.createElement("ul");
        list.className = "documents";

        if (matched.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "등록된 자료가 없습니다.";
          list.appendChild(empty);
        } else {
          matched.forEach((doc) => {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = doc.file;
            link.target = "_blank";
            link.rel = "noopener";

            const title = document.createElement("span");
            title.textContent = safeText(doc.title);

            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = doc.updated ? `개정 ${safeText(doc.updated)}` : "PDF";

            link.append(title, tag);
            item.appendChild(link);
            list.appendChild(item);
          });
        }

        article.appendChild(list);
        roomGrid.appendChild(article);
      });

      noResults.style.display = keyword && visibleCount === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", (event) => render(event.target.value));
    render();
  </script>
</body>
</html>
