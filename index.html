<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="한국폴리텍대학 창원캠퍼스 산업설비자동화과 MSDS 자료실">
  <title>산업설비자동화과 MSDS 자료실</title>
  <style>
    :root{
      --navy:#123d6a;
      --blue:#1f5f99;
      --blue2:#2c74ad;
      --soft:#edf4fa;
      --bg:#f3f6f9;
      --card:#fff;
      --line:#d8e2ea;
      --text:#1e2933;
      --muted:#66727e;
      --shadow:0 10px 28px rgba(20,55,88,.10);
      --shadow-soft:0 4px 14px rgba(20,55,88,.06);
      --focus:#ffbf47;
      --green:#287447;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.6;
    }

    .topbar{
      background:#0f2f50;
      color:rgba(255,255,255,.88);
      font-size:.86rem;
    }

    .topbar-inner{
      width:min(1180px,calc(100% - 28px));
      margin:0 auto;
      padding:9px 0;
      display:flex;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .hero{
      background:
        radial-gradient(circle at 82% 18%,rgba(255,255,255,.10),transparent 28%),
        linear-gradient(135deg,var(--navy),var(--blue2));
      color:#fff;
      padding:58px 20px 78px;
      text-align:center;
    }

    .hero-inner{width:min(980px,100%);margin:0 auto}

    .eyebrow{
      margin:0 0 10px;
      font-size:clamp(.95rem,2.2vw,1.12rem);
      font-weight:700;
      opacity:.95;
    }

    .hero h1{
      margin:0;
      font-size:clamp(2.5rem,6vw,4.2rem);
      letter-spacing:-.05em;
      line-height:1.15;
    }

    .hero-desc{
      max-width:760px;
      margin:18px auto 0;
      font-size:clamp(.95rem,2vw,1.06rem);
      opacity:.92;
    }

    main{
      width:min(1180px,calc(100% - 28px));
      margin:-42px auto 48px;
    }

    .content-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 250px;
      gap:22px;
      align-items:start;
    }

    .rooms-area{
      min-width:0;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      box-shadow:var(--shadow);
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:16px;
      margin-bottom:16px;
    }

    .section-title h2{
      margin:0;
      color:var(--navy);
      font-size:1.38rem;
    }

    .section-title p{
      margin:0;
      color:var(--muted);
      font-size:.9rem;
    }

    .room-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .room-card{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow-soft);
    }

    .room-card.is-open{
      grid-column:1 / -1;
    }

    .room-header{
      width:100%;
      border:0;
      background:var(--soft);
      color:var(--navy);
      padding:17px 18px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      text-align:left;
      cursor:pointer;
    }

    .room-header:hover{background:#e4eff8}

    .room-header:focus{
      outline:3px solid var(--focus);
      outline-offset:-3px;
    }

    .room-label{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .room-name{
      font-size:1.08rem;
      font-weight:800;
      line-height:1.35;
    }

    .room-number{
      margin-top:3px;
      color:var(--muted);
      font-size:.82rem;
      font-weight:700;
    }

    .arrow{
      font-weight:900;
      transition:transform .2s ease;
    }

    .room-card.is-open .arrow{
      transform:rotate(90deg);
    }

    .room-body{
      display:none;
      padding:18px;
      border-top:1px solid var(--line);
      background:#fff;
    }

    .room-card.is-open .room-body{
      display:block;
    }

    .room-guide{
      margin:0 0 14px;
      color:var(--muted);
      font-size:.92rem;
    }

    .mybox-button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:46px;
      padding:11px 18px;
      border-radius:10px;
      background:var(--navy);
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }

    .mybox-button:hover{background:#0d3157}

    .side-panel{
      position:sticky;
      top:18px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .side-status-card{
      overflow:hidden;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow-soft);
    }

    .side-status-card h2{
      margin:0;
      padding:16px 18px;
      color:#fff;
      background:linear-gradient(135deg,var(--navy),var(--blue));
      font-size:1.05rem;
    }

    .side-stat{
      padding:16px 18px;
      border-bottom:1px solid #edf1f4;
    }

    .side-stat:last-child{border-bottom:0}

    .summary-label{
      display:block;
      color:var(--muted);
      font-size:.82rem;
      margin-bottom:3px;
    }

    .summary-value{
      display:block;
      color:var(--navy);
      font-size:1.25rem;
      font-weight:800;
    }

    .status-normal{
      color:var(--green);
      font-size:1.05rem;
    }

    .open-all{
      display:block;
      margin:14px 16px 16px;
      padding:10px 12px;
      border-radius:9px;
      background:#edf4fa;
      color:var(--navy);
      text-align:center;
      text-decoration:none;
      font-weight:800;
    }

    .search-panel{
      margin-top:24px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:20px;
      box-shadow:var(--shadow-soft);
    }

    .search-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:16px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }

    .search-head label{
      color:var(--navy);
      font-size:1.1rem;
      font-weight:800;
    }

    .search-head span{
      color:var(--muted);
      font-size:.85rem;
    }

    .search-panel input{
      width:100%;
      padding:14px 16px;
      border:2px solid var(--line);
      border-radius:11px;
      font-size:1rem;
      outline:none;
    }

    .search-panel input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(31,95,153,.12);
    }

    .no-result{
      display:none;
      margin-top:16px;
      padding:20px;
      border:1px solid var(--line);
      border-radius:12px;
      color:var(--muted);
      text-align:center;
      background:#fff;
    }

    footer{
      text-align:center;
      color:var(--muted);
      font-size:.84rem;
      padding:10px 20px 30px;
    }

    @media(max-width:900px){
      .content-layout{
        grid-template-columns:1fr;
      }

      .side-panel{
        position:static;
      }

      .side-status-card{
        display:grid;
        grid-template-columns:repeat(3,1fr);
      }

      .side-status-card h2,
      .open-all{
        grid-column:1 / -1;
      }

      .side-stat{
        border-bottom:0;
        border-right:1px solid #edf1f4;
      }
    }

    @media(max-width:760px){
      .topbar-inner{
        justify-content:center;
        text-align:center;
      }

      .hero{
        padding:44px 18px 66px;
      }

      main{
        width:min(100% - 18px,1180px);
      }

      .rooms-area{
        padding:16px 12px;
      }

      .section-title{
        align-items:flex-start;
        flex-direction:column;
        gap:4px;
      }

      .room-grid{
        grid-template-columns:1fr;
        gap:12px;
      }

      .room-card,
      .room-card.is-open{
        grid-column:auto;
        width:100%;
      }

      .room-header{
        position:relative;
        display:block;
        min-height:96px;
        padding:16px 18px;
      }

      .room-label{
        display:block;
        padding-right:36px;
      }

      .room-name{
        display:block;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
        font-size:1.07rem;
      }

      .room-number{
        display:block;
        margin-top:10px;
        white-space:nowrap;
      }

      .arrow{
        position:absolute;
        right:18px;
        bottom:18px;
      }

      .side-status-card{
        display:block;
      }

      .side-stat{
        border-right:0;
        border-bottom:1px solid #edf1f4;
      }

      .mybox-button{
        width:100%;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span>한국폴리텍대학 창원캠퍼스</span>
      <span>산업설비자동화과 안전자료</span>
    </div>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">한국폴리텍대학 창원캠퍼스 산업설비자동화과</p>
      <h1>MSDS 자료실</h1>
      <p class="hero-desc">
        산업설비자동화과 실습실별 물질안전보건자료(MSDS)를 검색하고 열람할 수 있습니다.
      </p>
    </div>
  </header>

  <main>
    <div class="content-layout">
      <section class="rooms-area">
        <div class="section-title">
          <h2>실습실별 자료</h2>
          <p>실습실을 선택한 뒤 MYBOX에서 해당 폴더를 열어 자료를 확인하세요.</p>
        </div>

        <section id="roomGrid" class="room-grid" aria-label="실습실별 MSDS 자료"></section>
        <div id="noResult" class="no-result">검색 결과가 없습니다.</div>
      </section>

      <aside class="side-panel" aria-label="자료 현황">
        <section class="side-status-card">
          <h2>자료 현황</h2>

          <div class="side-stat">
            <span class="summary-label">실습실 구분</span>
            <strong class="summary-value">10개</strong>
          </div>

          <div class="side-stat">
            <span class="summary-label">자료 저장소</span>
            <strong class="summary-value">NAVER MYBOX</strong>
          </div>

          <div class="side-stat">
            <span class="summary-label">운영 상태</span>
            <strong class="summary-value status-normal">● 정상</strong>
          </div>

          <a class="open-all" href="https://naver.me/5UVe645d" target="_blank" rel="noopener">
            전체 MSDS 폴더 열기
          </a>
        </section>
      </aside>
    </div>

    <section class="search-panel">
      <div class="search-head">
        <label for="searchInput">실습실 검색</label>
        <span>실습실명 또는 호실로 검색</span>
      </div>
      <input id="searchInput" type="search" placeholder="예: 가스용접실, 8-2050" autocomplete="off">
    </section>
  </main>

  <footer>
    자료의 최신 개정일과 제조사 정보를 확인하여 사용하십시오.<br>
    © Jung Woosuk
  </footer>

  <script>
    const MYBOX_URL = "https://naver.me/5UVe645d";

    const rooms = [
      { name:"용접실습실", number:"8-1060" },
      { name:"특수용접실", number:"8-1080" },
      { name:"전기용접실", number:"8-1090" },
      { name:"가스용접실", number:"8-2050" },
      { name:"조선인력양성실습실", number:"8-2060" },
      { name:"X-RAY실", number:"8-2070" },
      { name:"배관실습실", number:"8-2090" },
      { name:"설비자동화실", number:"8-3150" },
      { name:"설비CAD실", number:"8-4120" },
      { name:"공용", number:"" }
    ];

    const roomGrid = document.getElementById("roomGrid");
    const searchInput = document.getElementById("searchInput");
    const noResult = document.getElementById("noResult");

    function closeAllCards(){
      document.querySelectorAll(".room-card.is-open").forEach(card => {
        card.classList.remove("is-open");
        card.querySelector(".room-header")?.setAttribute("aria-expanded","false");
      });
    }

    function render(query=""){
      const keyword = query.trim().toLocaleLowerCase("ko-KR");
      roomGrid.innerHTML = "";

      const filtered = rooms.filter(room => {
        if(!keyword) return true;
        return `${room.name} ${room.number}`.toLocaleLowerCase("ko-KR").includes(keyword);
      });

      filtered.forEach(room => {
        const card = document.createElement("article");
        card.className = "room-card";

        const header = document.createElement("button");
        header.type = "button";
        header.className = "room-header";
        header.setAttribute("aria-expanded","false");

        const label = document.createElement("span");
        label.className = "room-label";

        const name = document.createElement("span");
        name.className = "room-name";
        name.textContent = room.name;
        label.appendChild(name);

        if(room.number){
          const number = document.createElement("span");
          number.className = "room-number";
          number.textContent = room.number;
          label.appendChild(number);
        }

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "▶";
        arrow.setAttribute("aria-hidden","true");

        header.append(label,arrow);

        const body = document.createElement("div");
        body.className = "room-body";

        const guide = document.createElement("p");
        guide.className = "room-guide";
        guide.textContent = room.number
          ? `MYBOX가 열리면 “${room.name}(${room.number})” 폴더를 선택하세요.`
          : `MYBOX가 열리면 “${room.name}” 폴더를 선택하세요.`;

        const link = document.createElement("a");
        link.className = "mybox-button";
        link.href = MYBOX_URL;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "📂 MYBOX에서 자료 보기";

        body.append(guide,link);

        header.addEventListener("click",() => {
          const wasOpen = card.classList.contains("is-open");
          closeAllCards();

          if(!wasOpen){
            card.classList.add("is-open");
            header.setAttribute("aria-expanded","true");
          }
        });

        card.append(header,body);
        roomGrid.appendChild(card);
      });

      noResult.style.display = filtered.length === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input",event => render(event.target.value));

    render();
  </script>
</body>
</html>
