<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="한국폴리텍대학 창원캠퍼스 산업설비자동화과 MSDS 자료실" />
  <title>산업설비자동화과 MSDS 자료실</title>

  <style>
    :root {
      --navy: #123d6a;
      --blue: #1f5f99;
      --blue-2: #2c74ad;
      --blue-soft: #edf4fa;
      --bg: #f3f6f9;
      --card: #ffffff;
      --line: #d8e2ea;
      --text: #1e2933;
      --muted: #66727e;
      --shadow: 0 10px 28px rgba(20, 55, 88, 0.10);
      --shadow-soft: 0 4px 14px rgba(20, 55, 88, 0.06);
      --focus: #ffbf47;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    .topbar {
      background: #0f2f50;
      color: rgba(255,255,255,0.88);
      font-size: 0.86rem;
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 9px 0;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero {
      background:
        radial-gradient(circle at 82% 18%, rgba(255,255,255,0.10), transparent 28%),
        linear-gradient(135deg, var(--navy), var(--blue-2));
      color: white;
      padding: 58px 20px 78px;
      text-align: center;
    }

    .hero-inner {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: clamp(0.95rem, 2.2vw, 1.12rem);
      font-weight: 700;
      opacity: 0.95;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      letter-spacing: -0.05em;
      line-height: 1.15;
    }

    .hero-desc {
      max-width: 680px;
      margin: 18px auto 0;
      font-size: clamp(0.95rem, 2vw, 1.06rem);
      opacity: 0.92;
    }

    main {
      width: min(1120px, calc(100% - 28px));
      margin: -42px auto 48px;
    }

    .search-panel {
      background: var(--card);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(216, 226, 234, 0.9);
      margin-bottom: 24px;
    }

    .search-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .search-head label {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--navy);
    }

    .search-head span {
      color: var(--muted);
      font-size: 0.87rem;
    }

    .search-panel input {
      width: 100%;
      padding: 15px 17px;
      border: 2px solid var(--line);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }

    .search-panel input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(31, 95, 153, 0.12);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 17px 18px;
      box-shadow: var(--shadow-soft);
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.84rem;
      margin-bottom: 4px;
    }

    .summary-value {
      color: var(--navy);
      font-size: 1.3rem;
      font-weight: 800;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
    }

    .section-title h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1.35rem;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .room-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .room-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .room-header {
      width: 100%;
      border: 0;
      background: var(--blue-soft);
      color: var(--navy);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
    }

    .room-header:hover { background: #e4eff8; }

    .room-header:focus {
      outline: 3px solid var(--focus);
      outline-offset: -3px;
    }

    .room-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .room-name {
      font-size: 1.16rem;
      font-weight: 800;
    }

    .room-number {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .room-count {
      min-width: 42px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--navy);
      color: white;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .room-body {
      padding: 8px 18px 16px;
    }

    .document-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .document-list li {
      border-bottom: 1px solid #edf1f4;
    }

    .document-list li:last-child { border-bottom: 0; }

    .document-list a {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 4px;
      color: #174f80;
      text-decoration: none;
      font-weight: 700;
    }

    .document-list a:hover { text-decoration: underline; }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      flex: 0 0 auto;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 23px 10px 18px;
    }

    .empty-state strong {
      display: block;
      color: #45515c;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    .empty-state span {
      font-size: 0.85rem;
    }

    .no-result {
      display: none;
      margin-top: 20px;
      padding: 28px;
      text-align: center;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
      padding: 12px 20px 30px;
    }

    @media (max-width: 760px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .room-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 44px 18px 66px;
      }

      main {
        width: min(100% - 18px, 1120px);
      }

      .topbar-inner {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <span>한국폴리텍대학 창원캠퍼스</span>
      <span>산업설비자동화과 안전자료</span>
    </div>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">한국폴리텍대학 창원캠퍼스 산업설비자동화과</p>
      <h1>MSDS 자료실</h1>
      <p class="hero-desc">
        실습실에서 사용하는 물질안전보건자료를
        실습실별로 빠르게 검색하고 열람할 수 있습니다.
      </p>
    </div>
  </header>

  <main>
    <section class="search-panel">
      <div class="search-head">
        <label for="searchInput">물질명 또는 제품명 검색</label>
        <span>제품명·제조사·개정일 검색 지원</span>
      </div>
      <input
        id="searchInput"
        type="search"
        placeholder="예: 산소, 아세틸렌, 절삭유, 용접봉"
        autocomplete="off"
      />
    </section>

    <section class="summary" aria-label="자료 현황">
      <div class="summary-card">
        <span class="summary-label">실습실 구분</span>
        <span class="summary-value">10개</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">등록 자료</span>
        <span id="totalCount" class="summary-value">0건</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">최근 업데이트</span>
        <span id="latestUpdate" class="summary-value">준비 중</span>
      </div>
    </section>

    <div class="section-title">
      <h2>실습실별 자료</h2>
      <p>실습실명을 누르면 목록을 접거나 펼칠 수 있습니다.</p>
    </div>

    <section id="roomGrid" class="room-grid" aria-label="실습실별 MSDS 목록"></section>
    <div id="noResult" class="no-result">검색 결과가 없습니다.</div>
  </main>

  <footer>
    자료의 최신 개정일과 제조사 정보를 확인하여 관리하십시오.<br />
    © Jung Woosuk
  </footer>

  <script>
    const rooms = [
      { name: "용접실습실", number: "8-1060" },
      { name: "특수용접실", number: "8-1080" },
      { name: "전기용접실", number: "8-1090" },
      { name: "가스용접실", number: "8-2050" },
      { name: "조선인력양성실습실", number: "8-2060" },
      { name: "X-RAY실", number: "8-2070" },
      { name: "배관실습실", number: "8-2090" },
      { name: "설비자동화실", number: "8-3150" },
      { name: "설비CAD실", number: "8-4120" },
      { name: "공용", number: "" }
    ];

    const documents = [
      // 예시
      // {
      //   room: "가스용접실",
      //   title: "산소",
      //   manufacturer: "제조사명",
      //   updated: "2026-08",
      //   file: "pdf/가스용접실/산소.pdf"
      // }
    ];

    const roomGrid = document.getElementById("roomGrid");
    const searchInput = document.getElementById("searchInput");
    const noResult = document.getElementById("noResult");
    const totalCount = document.getElementById("totalCount");
    const latestUpdate = document.getElementById("latestUpdate");

    function normalize(value) {
      return String(value ?? "").toLocaleLowerCase("ko-KR");
    }

    function refreshSummary() {
      totalCount.textContent = `${documents.length}건`;

      const updates = documents
        .map((doc) => doc.updated)
        .filter(Boolean)
        .sort()
        .reverse();

      latestUpdate.textContent = updates[0] || "준비 중";
    }

    function render(query = "") {
      const keyword = normalize(query.trim());
      roomGrid.innerHTML = "";
      let resultCount = 0;

      rooms.forEach((room) => {
        const matched = documents
          .filter((doc) => doc.room === room.name)
          .filter((doc) => {
            if (!keyword) return true;

            const target = [
              room.name,
              room.number,
              doc.title,
              doc.manufacturer,
              doc.updated
            ].join(" ");

            return normalize(target).includes(keyword);
          })
          .sort((a, b) => a.title.localeCompare(b.title, "ko"));

        if (keyword && matched.length === 0) return;

        const card = document.createElement("article");
        card.className = "room-card";

        const header = document.createElement("button");
        header.className = "room-header";
        header.type = "button";
        header.setAttribute("aria-expanded", "true");

        const label = document.createElement("span");
        label.className = "room-label";

        const roomName = document.createElement("span");
        roomName.className = "room-name";
        roomName.textContent = room.name;

        label.appendChild(roomName);

        if (room.number) {
          const roomNumber = document.createElement("span");
          roomNumber.className = "room-number";
          roomNumber.textContent = room.number;
          label.appendChild(roomNumber);
        }

        const count = document.createElement("span");
        count.className = "room-count";
        count.textContent = `${matched.length}건`;

        header.append(label, count);

        const body = document.createElement("div");
        body.className = "room-body";

        header.addEventListener("click", () => {
          const isOpen = header.getAttribute("aria-expanded") === "true";
          header.setAttribute("aria-expanded", String(!isOpen));
          body.hidden = isOpen;
        });

        const list = document.createElement("ul");
        list.className = "document-list";

        if (matched.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          empty.innerHTML = "<strong>등록된 MSDS가 없습니다.</strong><span>자료 등록 후 목록에 표시됩니다.</span>";
          list.appendChild(empty);
        } else {
          matched.forEach((doc) => {
            resultCount += 1;

            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = doc.file;
            link.target = "_blank";
            link.rel = "noopener";

            const name = document.createElement("span");
            name.textContent = doc.title;

            const meta = document.createElement("span");
            meta.className = "meta";

            const info = [];
            if (doc.manufacturer) info.push(doc.manufacturer);
            if (doc.updated) info.push(`개정 ${doc.updated}`);

            meta.textContent = info.join(" · ") || "PDF";

            link.append(name, meta);
            item.appendChild(link);
            list.appendChild(item);
          });
        }

        body.appendChild(list);
        card.append(header, body);
        roomGrid.appendChild(card);
      });

      noResult.style.display =
        keyword && resultCount === 0 ? "block" : "none";
    }

    searchInput.addEventListener("input", (event) => {
      render(event.target.value);
    });

    refreshSummary();
    render();
  </script>
</body>
</html>
